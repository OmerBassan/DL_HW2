# Hyperparameters & Configuration
batch_size: 64
learning_rate: 0.00005      # backbones, once unfrozen
head_learning_rate: 0.001   # attention conv + cosine head (scale, bias), from epoch 0
num_epochs: 15
weight_decay: 0.00001 # Regularization

# Data
dataset_path: "data/lfw-deepfunneled/lfw-deepfunneled" # Path to the extracted LFW dataset
train_split_ratio: 0.8 # LEGACY: only src/utils/analyze_dataset.py still reads this (old 80/20 split); train/evaluate use splits_dir
lfw_meta_dir: "data"      # holds the official LFW View 1 pair CSVs (test = DevTest pairs)
splits_dir: "data/splits" # generated by `python -m src.data.splits`; commit these files
val_ratio: 0.15           # fraction of non-test PEOPLE held out for validation
n_val_pairs: 1000         # fixed balanced val pairs (500 same / 500 different)
seed: 42

# Model
input_shape: [224, 224]
embedding_dim: 1 # Dimension of the final distance output (before sigmoid)
dropout_prob: 0.1 # Dropout probability for regularization
unfreeze_epoch: 5 # Epoch to unfreeze backbone

# Paths
checkpoint_dir: "checkpoints"
log_dir: "logs"
